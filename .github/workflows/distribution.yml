# Planned contents: Assemble verified pinned binaries/images, checksums, SBOM and install bundles; not implemented.
# Current scope: explicit blocked gate, no product success claimed.
name: distribution
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance-blocked:
    runs-on: [self-hosted, linux, x64, runspindle-isolated, strix]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Require implementation and acceptance
        run: python3 tools/acceptance_gate.py distribution
