name: validation
on:
  push:
    branches: [main, 'ci/*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  strix-linux-x64:
    name: validation / strix-linux-x64
    runs-on: [self-hosted, linux, x64, runspindle-isolated, strix]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Prepare exact Tether feedback candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: newdarwindev/runspindle-tether
          ref: 670989839a0fccbcf2014d01609778ae6e4df424
          path: local/feedback-sources/tether
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare exact Refinery feedback candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: newdarwindev/runspindle-refinery
          ref: b68ba9d77d51ca453b3f0fa3a9fa31573d065250
          path: local/feedback-sources/refinery
          fetch-depth: 0
          persist-credentials: false
      - name: Run required candidate feedback lane
        run: >-
          python3 tools/feedback_hero.py
          --tether local/feedback-sources/tether
          --refinery local/feedback-sources/refinery
      - name: Verify pinned document renderer
        run: /opt/runspindle-documents/bin/python tools/check_document_runtime.py
      - name: Run implemented validation
        env:
          RUNSPINDLE_FEEDBACK_HERO_TETHER: ${{ github.workspace }}/local/feedback-sources/tether
          RUNSPINDLE_FEEDBACK_HERO_REFINERY: ${{ github.workspace }}/local/feedback-sources/refinery
        run: /opt/runspindle-documents/bin/python tools/validate.py
